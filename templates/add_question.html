{% extends "base.html" %}
{% block title %}Add Question{% endblock %}
{% block content %}
<h2>Add Question</h2>
<form method="POST" class="form">
    <label for="question_text">Question text</label>
    <textarea id="question_text" name="question_text" rows="4" required></textarea>

    <label for="max_marks">Maximum marks</label>
    <input type="number" id="max_marks" name="max_marks" min="1" required>

    <button type="submit">Save Question</button>
</form>
<p><a href="{{ url_for('home') }}">&larr; Back to home</a></p>
{% endblock %}
