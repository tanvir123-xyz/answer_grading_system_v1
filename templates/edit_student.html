{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block content %}
<h2>Edit Student</h2>
<form method="POST" class="form">
    <label for="roll_number">Roll number</label>
    <input type="number" id="roll_number" name="roll_number" value="{{ student.roll_number }}" required>

    <label for="student_name">Student name</label>
    <input type="text" id="student_name" name="student_name" value="{{ student.student_name }}" required>

    <label for="category">Category</label>
    <select id="category" name="category" required>
        <option value="good" {% if student.category == 'good' %}selected{% endif %}>Good</option>
        <option value="medium" {% if student.category == 'medium' %}selected{% endif %}>Medium</option>
        <option value="weak" {% if student.category == 'weak' %}selected{% endif %}>Weak</option>
    </select>

    <button type="submit">Save Changes</button>
</form>
<p><a href="{{ url_for('manage') }}">&larr; Back to Manage Data</a></p>
{% endblock %}
