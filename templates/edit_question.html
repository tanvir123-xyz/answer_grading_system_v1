{% extends "base.html" %}
{% block title %}Edit Question{% endblock %}
{% block content %}
<h2>Edit Question {{ question.question_id }}</h2>
<form method="POST" class="form">
    <label for="question_text">Question text</label>
    <textarea id="question_text" name="question_text" rows="4" required>{{ question.question_text }}</textarea>

    <label for="max_marks">Maximum marks</label>
    <input type="number" id="max_marks" name="max_marks" min="1" value="{{ question.max_marks }}" required>

    <button type="submit">Save Changes</button>
</form>
<p><a href="{{ url_for('manage') }}">&larr; Back to Manage Data</a></p>
{% endblock %}
